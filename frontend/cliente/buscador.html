<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Pedido</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilos base para el fondo oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #343a40;
            color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Estilo del contenedor principal */
        .container {
            max-width: 600px;
            padding: 40px;
            background-color: #2D3748;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: #A78BFA;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 600;
            color: #E2E8F0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #4A5568;
            border-radius: 8px;
            background-color: #4A5568;
            color: #F8F9FA;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]::placeholder {
            color: #A0AEC0;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #A78BFA;
        }

        .btn-base {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-rastrear {
            background-color: #8B5CF6;
            color: white;
        }

        .btn-rastrear:hover {
            background-color: #7C3AED;
        }

        .btn-inicio {
            background-color: #6c757d;
            color: white;
        }

        .btn-inicio:hover {
            background-color: #5a6268;
        }

        #mensaje-error {
            color: #F56565;
            margin-top: 15px;
            font-weight: bold;
        }

        .info-text {
            color: #A0AEC0;
            font-size: 0.9rem;
            display: block;
            margin-top: 5px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Rastrea tu Pedido</h2>
        <form id="buscadorForm">
            <div class="form-group">
                <label for="pedidoId">Ingresa tu ID de Pedido:</label>
                <input type="text" id="pedidoId" placeholder="Ej: 2acb3f97-2d15-4eea-a77d-493e5573dcf3" required>
                <span class="info-text">El ID es un código único que recibiste al completar tu compra</span>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-base btn-rastrear">
                    <i class="fas fa-search"></i> Buscar Seguimiento
                </button>

                <a href="../../index.html" class="btn-base btn-inicio">
                    <i class="fas fa-home"></i> Volver al Inicio
                </a>
            </div>

            <p id="mensaje-error"></p>
        </form>
    </div>

    <script src="buscador.js"></script>
</body>

</html>
